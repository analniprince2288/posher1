<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hakanai Connect — тест комментариев</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #202733; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 850px; margin: 64px auto; padding: 0 20px; }
    .panel { background: #fff; border: 1px solid #e3e7ed; border-radius: 14px; padding: 32px; box-shadow: 0 5px 22px rgba(30,40,60,.04); }
    h1 { margin: 0 0 12px; font-size: clamp(22px, 4vw, 30px); }
    p { color: #596579; line-height: 1.6; margin: 0 0 28px; }
    #hakanai-connect { min-height: 140px; }
    @media (max-width: 600px) { main { margin: 28px auto; } .panel { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Комментарии</h1>
      <p>Тестовая страница для проверки комментариев и уведомлений Hakanai Connect.</p>
      <div id="hakanai-connect"></div>
      <script async src="https://connect.hakanai.io/embed.js" data-key="dbe33d66-21ff-4b4e-89df-b7473f45e838"></script>
    </section>
  </main>
</body>
</html>
