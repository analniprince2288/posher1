<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annot8 — Widget Test</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1020; color: #eaf0ff; display: grid; place-items: center; padding: 24px; }
    .card { width: min(100%, 680px); background: #161e33; padding: 36px; border: 1px solid #2d3854; border-radius: 20px; box-shadow: 0 16px 48px #0004; }
    .eyebrow { color: #9caeff; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(26px, 5vw, 38px); }
    p { color: #b4bfd7; line-height: 1.65; }
    button { margin-top: 16px; cursor: pointer; background: #7185ff; border: 0; border-radius: 10px; padding: 12px 18px; color: #fff; font: inherit; font-weight: 600; }
    button:hover { background: #6175f2; }
    #result { color: #bbf7d0; min-height: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Annot8 / Test Page</div>
    <h1>Feedback Widget Test</h1>
    <p>This page is for testing the Annot8 widget. Open the widget and leave feedback on any element to test your project notifications.</p>
    <button id="demoButton" type="button">Test Button</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    document.getElementById('demoButton').addEventListener('click', function () {
      document.getElementById('result').textContent = 'Button works!';
    });
  </script>

  <!-- Annot8: original installation snippet -->
  <script
    src="https://www.annot8.app/widget.js"
    data-project-id="pj_8sCSQfNL6gyiWMINWidFmz7x"
    data-convex-url="https://superb-snail-880.convex.cloud"
    data-dashboard-url="https://www.annot8.app"
    async
  ></script>
</body>
</html>
