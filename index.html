<!doctype html>
<html lang="en">

  <title>Wiremo | Review Test</title>
  <style>

    h1 { font-size: clamp(28px, 5vw, 38px); margin: 10px 0 8px; }
    p { color: #626c79; line-height: 1.6; margin: 0; }
    .panel { background: #fff; border: 1px solid #e7e9ee; padding: clamp(20px, 4vw, 36px); border-radius: 17px; box-shadow: 0 8px 26px rgba(20,30,45,.035); min-height: 200px; }
    .footnote { font-size: 12px; margin-top: 18px; }
    #wiremo-widget { min-height: 90px; }
  </style>

<script>!function(){var e=document.getElementById("wiremo-widget")?document.getElementById("wiremo-widget").dataset:{},

</head>

  <main>
    <header>
      <div class="eyebrow">Wiremo QA page</div>

      <p>Submit a test review below to check the review and reply workflow.</p>
    </header>
    <section class="panel" aria-label="Wiremo review widget">
      <div id="wiremo-widget"

  </main>
</body>
</html>
