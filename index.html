<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fera.ai | Questions Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7fa; color: #1d2433; }
    main { width: min(820px, calc(100% - 32px)); margin: 72px auto; }
    header { margin-bottom: 30px; }
    .eyebrow {
      color: #727987; font-size: 13px; font-weight: 650;
      letter-spacing: .1em; text-transform: uppercase;
    }
    h1 { font-size: clamp(28px, 5vw, 38px); margin: 10px 0 8px; }
    p { color: #626c79; line-height: 1.6; margin: 0; }
    .panel {
      background: #fff; border: 1px solid #e7e9ee;
      padding: clamp(20px, 4vw, 36px); border-radius: 17px;
      box-shadow: 0 8px 26px rgba(20,30,45,.035);
      min-height: 200px;
    }
    .footnote { font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Fera.ai QA page</div>
      <h1>Product questions</h1>
      <p>Ask a test question below to check the question and reply workflow.</p>
    </header>

    <section class="panel" aria-label="Fera product questions widget">
      <!-- Replace with the actual product ID recognized by Fera.
           Shopify-only Liquid expressions do not work on static HTML. -->
      <div data-fera-widget="product_questions"
           data-fera-id="fwid_3Hqd6fY"
           data-product-id="13413"></div>
    </section>

    <p class="footnote">Test page. Questions and replies are managed in Fera Dashboard.</p>
  </main>

  <!-- // BEGIN // Fera.ai Integration Code - DO NOT MODIFY // -->
  <script type="application/javascript">
    window.fera = window.fera || [];
    (function(){
      // Fera App Embed v1
      const apiKey = "pk_8f65cbe7894987e20bb8dcc17e93087d5cfaf21e6d8e0cf1060c91186e68190a";
      const apiUrl = null;
      const baseCdnUrl = `https://cdn.fera.ai/js/v3/`;
      window.fera.push("configure", { api_key: apiKey });
      if (!document.querySelector('#fera_css')) {
        const element = document.createElement('link');element.href = `${ baseCdnUrl }fera.css`;element.id = "fera_css";element.rel = 'stylesheet';document.head.prepend(element);
      }

      if (apiUrl) window.fera.push("configure", { api_url: apiUrl, api_cdn_url: apiUrl });
      if (!(window.fera && !Array.isArray(window.fera)) && !document.querySelector('#fera_js')) {
        const element = document.createElement('script');element.src = `${ baseCdnUrl }fera.js`;element.id = "fera_js";element.async = true; document.body.append(element);
      }
    })();
  </script>
  <!-- // END // Fera.ai Integration Code // -->
</body>
</html>
