
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow">
  <title>SnagRelay — Widget Test</title>
  <style>
    :root { color-scheme: dark; }

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

      width: min(560px, calc(100% - 36px));
      padding: 38px; border: 1px solid #292b35;
      border-radius: 22px; background: #191b23;
    }
    .pill { display: inline-block; padding: 7px 11px; border-radius: 999px;

      font-weight: 700; letter-spacing: .06em; }
    h1 { font-size: clamp(25px, 5vw, 36px); margin: 18px 0 12px; line-height: 1.18; }
    p { color: #bfc0cb; font-size: 16px; line-height: 1.65; margin: 0; }
    small { display: block; margin-top: 25px; color: #858695; font-size: 13px; }
    @media (max-width: 500px) { main { padding: 26px; } }
  </style>
  <script src="https://app.snagrelay.com/widget/load/94a44d0e-b631-4652-b73d-ecb0ba0fab33" async></script>
</head>
<body>
  <main>
    <span class="pill">SNAGRELAY · TEST PAGE</span>
    <h1>Проверка виджета</h1>
    <p>На этой странице подключён SnagRelay. Откройте кнопку виджета, укажите тестовый email и отправьте баг-репорт.</p>
    <small>Это тестовая страница. Внешний вид, поля и отправка управляются настройками SnagRelay.</small>
  </main>
